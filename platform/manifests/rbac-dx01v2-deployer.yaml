# RBAC of the dx01v2 deploy role (docs/CONTRATO.md). The EKS access entry of dx01v2-gha-deploy puts it in
# the group dx01v2-deployers; this binding grants it the Role below in the dx01v2 namespace only.
# Secrets are read-only: External Secrets Operator writes them, the deployer never does.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dx01v2-deployer
  namespace: dx01v2
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dx01v2-deployers
  namespace: dx01v2
subjects:
  - kind: Group
    name: dx01v2-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: dx01v2-deployer
  apiGroup: rbac.authorization.k8s.io
