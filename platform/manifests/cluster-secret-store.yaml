# ClusterSecretStore of the contract: AWS Secrets Manager with the controller credentials
# (EKS Pod Identity, no explicit auth). __AWS_REGION__ is replaced by platform/render-manifests.sh
# with the value of the SSM parameter /tx01v2/lab/region. Usable from the dx01v2 namespace only.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  conditions:
    - namespaces:
        - dx01v2
  provider:
    aws:
      service: SecretsManager
      region: __AWS_REGION__
