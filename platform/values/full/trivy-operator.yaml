# Overlay of platform/local/values/trivy-operator.yaml for the profile full in the cloud (same chart,
# same images by digest, same sizes). The mirror and the plain-HTTP registry exist only for the
# registry container of the local lab; the images of the app come from Amazon ECR. A null removes a
# key of the base. Limit, not verified in a cloud: the scan jobs of this release have no ECR
# credentials (an IAM role for the operator is not part of the profile), so the VulnerabilityReports
# of the private images of the app can be missing; the ConfigAuditReports and the scans of public
# images do not depend on it (docs/ARQUITETURA.md).
trivy:
  registry:
    mirror: null
  nonSslRegistries: null
