# Durable cloud retention for the full profile; the local test profile stays lightweight and ephemeral.
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: tx01v2-gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 12Gi

alertmanager:
  alertmanagerSpec:
    retention: 72h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: tx01v2-gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi

grafana:
  persistence:
    enabled: true
    type: sts
    storageClassName: tx01v2-gp3
    accessModes: [ReadWriteOnce]
    size: 2Gi
