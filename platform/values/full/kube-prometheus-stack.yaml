# Overlay of platform/local/values/kube-prometheus-stack.yaml for the profile full in the cloud (same
# chart, same images by digest, same sizes and rules). The in-cluster sink of the local lab does not
# exist here, so Alertmanager keeps every alert (its UI and Grafana show them) and delivers none:
# SLACK_WEBHOOK_URL at install time adds the Slack receiver
# (platform/values/full/kube-prometheus-stack-slack.yaml). Helm merges maps and replaces lists: the
# routes of the base are removed with null and the receivers are written out.
alertmanager:
  alertmanagerSpec:
    secrets: []
  config:
    route:
      receiver: "null"
      routes: null
    receivers:
      - name: "null"
