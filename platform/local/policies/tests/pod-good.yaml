apiVersion: v1
kind: Pod
metadata:
  name: good
  namespace: dx01v2
  labels:
    app.kubernetes.io/name: api
spec:
  containers:
    - name: api
      image: registry.tx01v2.local/dx01v2/api:0123456789abcdef0123456789abcdef01234567
      readinessProbe:
        httpGet:
          path: /readyz
          port: 3000
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    - name: proxy
      image: docker.io/istio/proxyv2:1.31.1@sha256:d86cba0dd1eb15c00b6901c69ce5ae3d2d5f8427a47751098cf8c3ab2a4a62e9
      readinessProbe:
        httpGet:
          path: /healthz/ready
          port: 15021
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
