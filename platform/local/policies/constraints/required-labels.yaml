# Gateway pods are created by Istio with its own labels: only workloads of the app are checked.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: LabRequiredLabels
metadata:
  name: required-labels
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: [Pod]
    namespaceSelector:
      matchLabels:
        policy.lab/enforce: "true"
    labelSelector:
      matchExpressions:
        - key: gateway.networking.k8s.io/gateway-name
          operator: DoesNotExist
  parameters:
    labels:
      - app.kubernetes.io/name
