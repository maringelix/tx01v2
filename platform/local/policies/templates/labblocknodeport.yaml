apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: labblocknodeport
  annotations:
    description: No Service of type NodePort (v1 tx01 block-nodeport); traffic enters through the Gateway.
spec:
  crd:
    spec:
      names:
        kind: LabBlockNodePort
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package labblocknodeport

        violation[{"msg": msg}] {
          input.review.object.spec.type == "NodePort"
          msg := sprintf("Service <%v> is of type NodePort", [input.review.object.metadata.name])
        }
