apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: labrequiredprobes
  annotations:
    description: Every long-running container has a readiness probe (v1 tx01 require-probes).
spec:
  crd:
    spec:
      names:
        kind: LabRequiredProbes
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package labrequiredprobes

        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          not c.readinessProbe
          msg := sprintf("container <%v> has no readinessProbe", [c.name])
        }
