apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: labcontainerresources
  annotations:
    description: Every container sets cpu and memory requests and a memory limit (v1 tx01 resource-limits).
spec:
  crd:
    spec:
      names:
        kind: LabContainerResources
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package labcontainerresources

        containers[c] {
          c := input.review.object.spec.containers[_]
        }
        containers[c] {
          c := input.review.object.spec.initContainers[_]
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not c.resources.requests.cpu
          msg := sprintf("container <%v> has no cpu request", [c.name])
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not c.resources.requests.memory
          msg := sprintf("container <%v> has no memory request", [c.name])
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not c.resources.limits.memory
          msg := sprintf("container <%v> has no memory limit", [c.name])
        }
