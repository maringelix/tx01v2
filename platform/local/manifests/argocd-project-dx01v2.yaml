# AppProject dx01v2: the local twin of the dx01v2-deployer Role. Argo CD may sync only the GitOps
# repository of the lab git server, only into the namespace dx01v2 and only these kinds (no Secret,
# no Namespace, nothing cluster-scoped). __GITOPS_READ_URL__ is replaced by install.sh.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dx01v2
  namespace: argocd
spec:
  description: dx01v2 app of the local lab (docs/CONTRATO.md, Lab local)
  sourceRepos:
    - __GITOPS_READ_URL__
  destinations:
    - server: https://kubernetes.default.svc
      namespace: dx01v2
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: external-secrets.io
      kind: ExternalSecret
    - group: gateway.networking.k8s.io
      kind: Gateway
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: security.istio.io
      kind: PeerAuthentication
    - group: security.istio.io
      kind: AuthorizationPolicy
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
