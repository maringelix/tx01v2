# ClusterSecretStore local-secrets: the local twin of aws-secrets-manager. The "remote" secret manager
# is the namespace lab-secrets; ESO reads it with the token of the service account eso-local-store,
# which may only read Secrets there. Usable from the dx01v2 namespace only (like the cloud store).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-local-store
  namespace: lab-secrets
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-local-store
  namespace: lab-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-local-store
  namespace: lab-secrets
subjects:
  - kind: ServiceAccount
    name: eso-local-store
    namespace: lab-secrets
roleRef:
  kind: Role
  name: eso-local-store
  apiGroup: rbac.authorization.k8s.io
---
# ESO checks its own permissions before it reports the store Ready.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-local-store-review
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-local-store-review
subjects:
  - kind: ServiceAccount
    name: eso-local-store
    namespace: lab-secrets
roleRef:
  kind: ClusterRole
  name: eso-local-store-review
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: local-secrets
spec:
  conditions:
    - namespaces:
        - dx01v2
  provider:
    kubernetes:
      remoteNamespace: lab-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: lab-secrets
      auth:
        serviceAccount:
          name: eso-local-store
          namespace: lab-secrets
