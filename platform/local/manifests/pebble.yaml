apiVersion: v1
kind: Namespace
metadata:
  name: lab-acme
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pebble-config
  namespace: lab-acme
data:
  pebble-config.json: |
    {
      "pebble": {
        "listenAddress": "0.0.0.0:14000",
        "managementListenAddress": "",
        "certificate": "/test/certs/pebble/tls.crt",
        "privateKey": "/test/certs/pebble/tls.key",
        "httpPort": 5002,
        "tlsPort": 5001,
        "ocspResponderURL": "",
        "externalAccountBindingRequired": false,
        "domainBlocklist": [],
        "retryAfter": {
          "authz": 1,
          "order": 1
        },
        "keyAlgorithm": "ecdsa",
        "profiles": {
          "default": {
            "description": "Local ACME integration test",
            "validityPeriod": 1200
          },
          "shortlived": {
            "description": "20-minute certificate for automatic-renewal proof",
            "validityPeriod": 1200
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: lab-acme
  labels:
    app.kubernetes.io/name: pebble
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pebble
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pebble
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
          args:
            - -config
            - /test/config/pebble-config.json
            - -dnsserver
            - challtestsrv.lab-acme.svc.cluster.local:8053
          env:
            - name: PEBBLE_VA_NOSLEEP
              value: "1"
            - name: PEBBLE_AUTHZREUSE
              value: "0"
          ports:
            - name: acme
              containerPort: 14000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: acme
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: acme
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /test/config
              readOnly: true
            - name: server-tls
              mountPath: /test/certs/pebble
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pebble-config
        - name: server-tls
          secret:
            secretName: pebble-server-tls
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: lab-acme
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pebble
  ports:
    - name: acme
      port: 14000
      targetPort: acme
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: challtestsrv
  namespace: lab-acme
  labels:
    app.kubernetes.io/name: challtestsrv
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: challtestsrv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: challtestsrv
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: challtestsrv
          image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1@sha256:12ce21884def456bcf9786542113949e1f19dc7738d2c70e156c2d0c38a1405b
          args:
            - -http01
            - ""
            - -https01
            - ""
            - -tlsalpn01
            - ""
            - -doh
            - ""
            - -dnsserver
            - :8053
            - -management
            - :8055
            - -defaultIPv4
            - 127.0.0.1
            - -defaultIPv6
            - ""
          ports:
            - name: management
              containerPort: 8055
              protocol: TCP
            - name: dns
              containerPort: 8053
              protocol: UDP
            - name: dns-tcp
              containerPort: 8053
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: management
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: challtestsrv
  namespace: lab-acme
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: challtestsrv
  ports:
    - name: management
      port: 8055
      targetPort: management
      protocol: TCP
    - name: dns
      port: 8053
      targetPort: dns
      protocol: UDP
    - name: dns-tcp
      port: 8053
      targetPort: dns-tcp
      protocol: TCP
