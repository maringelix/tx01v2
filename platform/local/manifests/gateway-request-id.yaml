# The ALB passes X-Request-Id through untouched; Envoy at the edge replaces an external one by
# default, and with tracing on it would also rewrite one character of a UUID-shaped id to record the
# sampling decision. This keeps the local twin of the ALB faithful for every Istio Gateway of the lab
# (context GATEWAY only: sidecars and waypoints are not touched): the external id is kept as it came,
# and sampling never depends on it (tracing samples by the W3C traceparent). The app still decides
# whether an incoming id is safe (dx01v2 api/src/middleware/request-id.ts).
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: gateway-preserve-request-id
  namespace: istio-system
spec:
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            preserve_external_request_id: true
            request_id_extension:
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
                pack_trace_reason: false
                use_request_id_for_trace_sampling: false
