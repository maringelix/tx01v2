# Local overrides on top of platform/values/external-secrets.yaml (same chart, images and digests as
# the cloud platform). No Pod Identity here: the ClusterSecretStore local-secrets authenticates with
# the token of a service account (platform/local/manifests/secret-store.yaml).
resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 256Mi
