# aqua/trivy-operator 0.37.0 (operator 0.35.0, scanner trivy 0.75.0, namespace trivy-system): continuous
# vulnerability and configuration scanning inside the cluster (v1 tx03 tried it on Autopilot, where
# its webhooks were refused). It scans the app namespace only and writes VulnerabilityReports and
# ConfigAuditReports. Images pinned by digest (verified 2026-10-12).
targetNamespaces: dx01v2
image:
  tag: 0.35.0@sha256:4cdb11af98ff409cfa7af980098203a841a5fe957cc6a0bbb0df7668065eb5fa
trivy:
  image:
    tag: 0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  severity: HIGH,CRITICAL
  ignoreUnfixed: true
  # Images of the app are named registry.tx01v2.local/... (the kind node maps that name to the registry
  # container). Scan jobs are pods without that mapping: install.sh sets the mirror to the registry
  # address on the lab network (plain HTTP).
  registry:
    mirror:
      "registry.tx01v2.local": __REGISTRY_ENDPOINT__
  nonSslRegistries:
    labRegistry: __REGISTRY_ENDPOINT__
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 768Mi
  # Built-in Trivy server (ClientServer mode, below): the vulnerability DB lives in the server; the
  # lab is throwaway, so its cache is an emptyDir (no PersistentVolumeClaim).
  storageClassEnabled: false
  server:
    podSecurityContext:
      fsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      privileged: false
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
operator:
  # ClientServer mode: a scan job runs one Trivy client per container of the workload. In Standalone
  # mode those clients share one filesystem cache and Trivy >= 0.66 locks it, so the second container
  # of a pod (the API and its migrate init container) failed with "cache may be in use by another
  # process" and never got a VulnerabilityReport. Clients of the built-in server use its remote cache.
  builtInTrivyServer: true
  scanJobsConcurrentLimit: 2
  scanJobTimeout: 10m
  sbomGenerationEnabled: false
  exposedSecretScannerEnabled: false
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 384Mi
