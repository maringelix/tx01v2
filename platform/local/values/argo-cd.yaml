# argo/argo-cd 10.10.3 (Argo CD v3.5.5, namespace argocd): the GitOps engine of the local lab. v1 ran
# Argo CD 2.x on a public LoadBalancer with the admin password in a workflow input
# (docs/LESSONS_LEARNED.md); here it is ClusterIP only with the local admin user disabled (the
# Application resources are inspected with kubectl), and it reads the GitOps repository of the lab git
# server anonymously, read-only. Images pinned by digest (verified 2026-10-12).
global:
  image:
    tag: v3.5.5@sha256:13db7b10db23283b1b36f855046602e18539a8a8204c9f6f039e8896c8897518
  domain: argocd.tx01v2.local
configs:
  cm:
    # The UI and API are reached through kubectl port-forward only; no local admin user.
    admin.enabled: "false"
    exec.enabled: "false"
    timeout.reconciliation: 60s
  params:
    server.insecure: "true"
  secret:
    createSecret: true
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
redis:
  image:
    repository: docker.io/library/redis
    tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
controller:
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
server:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
repoServer:
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 384Mi
