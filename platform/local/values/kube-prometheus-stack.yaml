# prometheus-community/kube-prometheus-stack 92.3.0 (namespace monitoring; node-exporter in the
# privileged namespace monitoring-agents). The v1 stack, without its mistakes (docs/LICOES_APRENDIDAS.md,
# 7.x): admission webhooks on (certificates from cert-manager), Grafana only through port-forward with a
# generated password, rules that the harness tests with promtool, Alertmanager delivering to a sink that
# the probes read. Images pinned by digest (verified 2026-10-12).
crds:
  enabled: true

# kind runs etcd, the controller manager, the scheduler and kube-proxy with metrics on 127.0.0.1 only:
# no targets, no alerts that can never resolve.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false

prometheusOperator:
  image:
    sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
  prometheusConfigReloader:
    image:
      sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
  admissionWebhooks:
    # Invalid PrometheusRules are refused at apply time (v1 turned the webhooks off).
    enabled: true
    certManager:
      enabled: true
    patch:
      enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

prometheus:
  prometheusSpec:
    image:
      sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
    retention: 6h
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Every ServiceMonitor, PodMonitor and PrometheusRule of the cluster (dx01v2 ships its own).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    # Exemplars: a histogram sample keeps the trace_id of a request it measured (the dx01v2 API and
    # the spanmetrics of the OpenTelemetry Collector), and Grafana links it to the trace in Tempo.
    enableFeatures: [exemplar-storage]
    exemplars:
      maxSize: 100000
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    image:
      sha: e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    retention: 24h
    # Secret alertmanager-slack (key webhook-url), written by install.sh: LOCAL_SLACK_WEBHOOK_URL when
    # it is set, else the Slack path of the in-cluster sink. Mounted under
    # /etc/alertmanager/secrets/alertmanager-slack/.
    secrets: [alertmanager-slack]
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  # Every alert goes to the in-cluster sink (platform/local/manifests/alert-sink.yaml), whose log the
  # probes read. Warnings and critical alerts also go to Slack, like the channels of v1, but the
  # webhook is never in versioned values (v1 put it there): it comes from the Secret above.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: alert-sink
      group_by: [alertname, namespace]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: slack
          matchers:
            - severity =~ "warning|critical"
          continue: true
        - receiver: alert-sink
    receivers:
      - name: "null"
      - name: alert-sink
        webhook_configs:
          - url: http://alert-sink.monitoring.svc:8080/alertmanager
            send_resolved: true
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#lab-alerts"
            send_resolved: true

grafana:
  image:
    sha: 202e5d5b3f8499e70ccac7991eea6d7da72d2790eb2e0597e7987acf724e7180
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  initChownData:
    enabled: false
  testFramework:
    enabled: false
  sidecar:
    image:
      sha: 092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      # metrics -> traces: an exemplar of the Prometheus datasource opens its trace in Tempo.
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
  # The three signals linked to each other: logs -> traces (the trace_id field of a JSON log line),
  # traces -> logs (the lines of the same trace_id in Loki) and metrics -> traces (above).
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
      jsonData:
        derivedFields:
          - name: trace_id
            matcherType: regex
            matcherRegex: '"trace_id":"([0-9a-f]{32})"'
            datasourceUid: tempo
            url: "$${__value.raw}"
            urlDisplayLabel: Trace in Tempo
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc:3200
      access: proxy
      jsonData:
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          tags:
            - key: k8s.namespace.name
              value: namespace
        tracesToMetrics:
          datasourceUid: prometheus
  # Grafana 13 was OOMKilled at 256Mi while starting its app platform.
  resources:
    requests:
      cpu: 20m
      memory: 192Mi
    limits:
      memory: 640Mi

kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[cost.lab/owner,cost.lab/environment]
  image:
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  # hostNetwork, hostPID and hostPath: it needs a privileged namespace.
  namespaceOverride: monitoring-agents
  image:
    digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
