# vmware-tanzu/velero 12.2.1 (Velero v1.18.4 + plugin for AWS v1.14.4, namespace velero): backup and
# restore of Kubernetes resources to the S3 emulator of terraform/envs/local (v1 exported Secrets in
# base64 to a CI artifact and never restored; docs/LICOES_APRENDIDAS.md). install.sh passes the bucket,
# the endpoint and the credentials Secret. Images pinned by digest (verified 2026-10-12).
image:
  repository: docker.io/velero/velero
  tag: v1.18.4@sha256:c89fb5b6d1fd6afd368e0f483e6f5555fd62851a1eada8ac5c72482e674ca17b
initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
kubectl:
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.36.4@sha256:b8d523e7b8cdc5e3caa0f8891ee9f504abf137dec786e6e0ddd33e4f272c2f13
upgradeCRDs: true
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 512Mi
snapshotsEnabled: false
deployNodeAgent: false
credentials:
  useSecret: true
  existingSecret: velero-s3
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: __S3_BUCKET__
      default: true
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: __S3_ENDPOINT__
        checksumAlgorithm: ""
