# Applies terraform/envs/lab. CLOUD-MUTATING and billable: dispatch manually, after reading the latest
# terraform-plan run. The `lab` environment (required reviewer, main only) gates the OIDC role.
name: terraform-apply

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tx01v2-lab-cloud
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      # A secret, not a variable: the logs of a public repository are public, and a secret is masked.
      TF_VAR_endpoint_public_access_cidrs: ${{ secrets.LAB_ENDPOINT_PUBLIC_ACCESS_CIDRS }}
      TF_VAR_allow_endpoint_from_anywhere: ${{ vars.LAB_ALLOW_ENDPOINT_FROM_ANYWHERE || 'false' }}
      TF_VAR_cluster_admin_principal_arns: ${{ vars.LAB_CLUSTER_ADMIN_PRINCIPAL_ARNS }}
      TF_VAR_app_deployer_principal_arns: ${{ vars.LAB_APP_DEPLOYER_PRINCIPAL_ARNS || '[]' }}
      TF_VAR_node_instance_types: ${{ vars.LAB_NODE_INSTANCE_TYPES || '["t3.medium","t3a.medium"]' }}
      TF_VAR_node_desired_size: ${{ vars.LAB_NODE_DESIRED_SIZE || '2' }}
      TF_VAR_app_domain_name: ${{ secrets.LAB_APP_DOMAIN_NAME }}
      TF_VAR_route53_public_zone_id: ${{ secrets.LAB_ROUTE53_PUBLIC_ZONE_ID }}
    steps:
      - name: Mask the addresses of the operator in the logs
        env:
          CIDRS: ${{ secrets.LAB_ENDPOINT_PUBLIC_ACCESS_CIDRS }}
          APP_DOMAIN_NAME: ${{ secrets.LAB_APP_DOMAIN_NAME }}
          ROUTE53_PUBLIC_ZONE_ID: ${{ secrets.LAB_ROUTE53_PUBLIC_ZONE_ID }}
        run: |
          if [[ -n "$APP_DOMAIN_NAME" ]]; then
            echo "::add-mask::$APP_DOMAIN_NAME"
          fi
          if [[ -n "$ROUTE53_PUBLIC_ZONE_ID" ]]; then
            echo "::add-mask::$ROUTE53_PUBLIC_ZONE_ID"
          fi
          if [[ -n "$CIDRS" ]]; then
            addresses="$(jq -r '.[]' <<<"$CIDRS")"
            while IFS= read -r cidr; do
              echo "::add-mask::$cidr"
              echo "::add-mask::${cidr%%/*}"
            done <<<"$addresses"
          fi

      - name: Check repository variables
        env:
          AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: |
          missing=()
          for v in AWS_REGION TF_STATE_BUCKET AWS_APPLY_ROLE_ARN TF_VAR_endpoint_public_access_cidrs TF_VAR_cluster_admin_principal_arns; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing repository variables or secrets for: ${missing[*]}. Settings > Secrets and variables > Actions > Variables; names and values in docs/RUNBOOK.md (section 'Variáveis do GitHub')."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: tx01v2-apply-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Install terraform (pinned, SHA256-verified)
        run: |
          bash scripts/install-tools.sh terraform
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"

      - name: terraform init
        run: terraform -chdir=terraform/envs/lab init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform plan
        run: terraform -chdir=terraform/envs/lab plan -input=false -no-color -out=tfplan

      - name: terraform apply
        run: terraform -chdir=terraform/envs/lab apply -input=false -no-color tfplan

      - name: Outputs to the job summary
        env:
          CIDRS: ${{ secrets.LAB_ENDPOINT_PUBLIC_ACCESS_CIDRS }}
          APP_DOMAIN_NAME: ${{ secrets.LAB_APP_DOMAIN_NAME }}
          ROUTE53_PUBLIC_ZONE_ID: ${{ secrets.LAB_ROUTE53_PUBLIC_ZONE_ID }}
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          outputs="$(terraform -chdir=terraform/envs/lab output -no-color)"
          outputs="${outputs//"$account_id"/<ACCOUNT_ID>}"
          if [[ -n "$APP_DOMAIN_NAME" ]]; then outputs="${outputs//"$APP_DOMAIN_NAME"/<APP_DOMAIN>}"; fi
          if [[ -n "$ROUTE53_PUBLIC_ZONE_ID" ]]; then outputs="${outputs//"$ROUTE53_PUBLIC_ZONE_ID"/<HOSTED_ZONE_ID>}"; fi
          # The job summary is not covered by the masks of the log.
          while IFS= read -r cidr; do
            outputs="${outputs//"$cidr"/<CIDR>}"
            outputs="${outputs//"${cidr%%/*}"/<IP>}"
          done < <(jq -r '.[]' <<<"$CIDRS")
          {
            echo "## terraform apply: terraform/envs/lab"
            echo '```'
            printf '%s\n' "$outputs"
            echo '```'
            echo "Next: dispatch the platform workflow (action=install), then deploy dx01v2. Destroy when done."
          } >> "$GITHUB_STEP_SUMMARY"
