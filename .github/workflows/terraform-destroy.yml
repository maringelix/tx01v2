# Destroys the lab. CLOUD-MUTATING: requires the typed confirmation "destroy tx01v2-lab" and the `lab`
# environment approval. scripts/destroy.sh runs platform/uninstall.sh (if the cluster exists), falls
# back to the AWS API for the load balancers when it fails, runs terraform destroy and always ends
# with scripts/leftovers.sh. Every step fails loudly; nothing is ignored.
name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: destroy tx01v2-lab'
        required: true
        type: string
      force_unlock_id:
        description: 'Only after an interrupted apply or destroy: the lock ID of the Terraform error message (docs/RUNBOOK.md, section 8)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: tx01v2-lab-cloud
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      # A secret, not a variable: the logs of a public repository are public, and a secret is masked.
      TF_VAR_endpoint_public_access_cidrs: ${{ secrets.LAB_ENDPOINT_PUBLIC_ACCESS_CIDRS }}
      TF_VAR_allow_endpoint_from_anywhere: ${{ vars.LAB_ALLOW_ENDPOINT_FROM_ANYWHERE || 'false' }}
      TF_VAR_cluster_admin_principal_arns: ${{ vars.LAB_CLUSTER_ADMIN_PRINCIPAL_ARNS }}
      TF_VAR_app_deployer_principal_arns: ${{ vars.LAB_APP_DEPLOYER_PRINCIPAL_ARNS || '[]' }}
      TF_VAR_node_instance_types: ${{ vars.LAB_NODE_INSTANCE_TYPES || '["t3.medium","t3a.medium"]' }}
      TF_VAR_node_desired_size: ${{ vars.LAB_NODE_DESIRED_SIZE || '2' }}
      TF_VAR_app_domain_name: ${{ secrets.LAB_APP_DOMAIN_NAME }}
      TF_VAR_route53_public_zone_id: ${{ secrets.LAB_ROUTE53_PUBLIC_ZONE_ID }}
    steps:
      - name: Mask the addresses of the operator in the logs
        env:
          CIDRS: ${{ secrets.LAB_ENDPOINT_PUBLIC_ACCESS_CIDRS }}
          APP_DOMAIN_NAME: ${{ secrets.LAB_APP_DOMAIN_NAME }}
          ROUTE53_PUBLIC_ZONE_ID: ${{ secrets.LAB_ROUTE53_PUBLIC_ZONE_ID }}
        run: |
          [[ -z "$APP_DOMAIN_NAME" ]] || echo "::add-mask::$APP_DOMAIN_NAME"
          [[ -z "$ROUTE53_PUBLIC_ZONE_ID" ]] || echo "::add-mask::$ROUTE53_PUBLIC_ZONE_ID"
          if [[ -n "$CIDRS" ]]; then
            addresses="$(jq -r '.[]' <<<"$CIDRS")"
            while IFS= read -r cidr; do
              echo "::add-mask::$cidr"
              echo "::add-mask::${cidr%%/*}"
            done <<<"$addresses"
          fi

      - name: Check the confirmation and repository variables
        env:
          CONFIRM: ${{ inputs.confirm }}
          AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: |
          if [[ "$CONFIRM" != "destroy tx01v2-lab" ]]; then
            echo "::error::Confirmation mismatch: type exactly 'destroy tx01v2-lab'."
            exit 1
          fi
          missing=()
          for v in AWS_REGION TF_STATE_BUCKET AWS_APPLY_ROLE_ARN TF_VAR_endpoint_public_access_cidrs TF_VAR_cluster_admin_principal_arns; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing repository variables or secrets for: ${missing[*]}. See docs/RUNBOOK.md (section 'Variáveis do GitHub')."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: tx01v2-destroy-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Install terraform, kubectl and helm (pinned, SHA256-verified)
        run: |
          bash scripts/install-tools.sh terraform kubectl helm
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"

      # One step on purpose: the script keeps going after a failed uninstall and always ends with the
      # leftover check (the order and the fallback are tested offline: check destroy-flow).
      - name: Destroy the platform layer and the lab, then check for leftovers
        env:
          FORCE_UNLOCK_ID: ${{ inputs.force_unlock_id }}
        run: |
          args=()
          if [[ -n "$FORCE_UNLOCK_ID" ]]; then
            args=(--force-unlock "$FORCE_UNLOCK_ID")
          fi
          bash scripts/destroy.sh "${args[@]}"
