# Destroys the lab. CLOUD-MUTATING: requires the typed confirmation "destroy tx01v2-lab" and the `lab`
# environment approval. Order: platform/uninstall.sh (if the cluster exists) -> terraform destroy ->
# scripts/leftovers.sh. Every step fails loudly; nothing is ignored.
name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: destroy tx01v2-lab'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tx01v2-lab-cloud
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_endpoint_public_access_cidrs: ${{ vars.LAB_ENDPOINT_PUBLIC_ACCESS_CIDRS }}
      TF_VAR_allow_endpoint_from_anywhere: ${{ vars.LAB_ALLOW_ENDPOINT_FROM_ANYWHERE || 'false' }}
      TF_VAR_cluster_admin_principal_arns: ${{ vars.LAB_CLUSTER_ADMIN_PRINCIPAL_ARNS }}
      TF_VAR_app_deployer_principal_arns: ${{ vars.LAB_APP_DEPLOYER_PRINCIPAL_ARNS || '[]' }}
    steps:
      - name: Check the confirmation and repository variables
        env:
          CONFIRM: ${{ inputs.confirm }}
          AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: |
          if [[ "$CONFIRM" != "destroy tx01v2-lab" ]]; then
            echo "::error::Confirmation mismatch: type exactly 'destroy tx01v2-lab'."
            exit 1
          fi
          missing=()
          for v in AWS_REGION TF_STATE_BUCKET AWS_APPLY_ROLE_ARN TF_VAR_endpoint_public_access_cidrs TF_VAR_cluster_admin_principal_arns; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing repository variables for: ${missing[*]}. See docs/RUNBOOK.md (section 'Variáveis do GitHub')."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: tx01v2-destroy-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Install terraform, kubectl and helm (pinned, SHA256-verified)
        run: |
          bash scripts/install-tools.sh terraform kubectl helm
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"

      - name: Remove the platform layer (deletes the ALBs created by the controller)
        run: |
          exists="$(aws eks list-clusters --query "contains(clusters, 'tx01v2-lab')" --output text)"
          if [[ "$exists" == "True" ]]; then
            bash platform/uninstall.sh
          else
            echo "cluster tx01v2-lab not found: nothing to uninstall"
          fi

      - name: terraform init
        run: terraform -chdir=terraform/envs/lab init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform destroy
        run: terraform -chdir=terraform/envs/lab destroy -auto-approve -input=false -no-color

      - name: Leftover check (must find nothing billable)
        run: bash scripts/leftovers.sh --retry-for 900
