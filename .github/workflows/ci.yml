# The harness is the CI: every job only runs `make <target>` (docs/HARNESS.md).
# Job ids are stable: `static` and `test` are required status checks (.github/rulesets/main.json).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: catches rot (expired ignores, moved URLs, new findings)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HARNESS_STRICT: "1"

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'tools/checksums.txt', 'scripts/lib/tools.sh') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/**/.terraform.lock.hcl', 'terraform/**/versions.tf') }}
          restore-keys: terraform-plugins-${{ runner.os }}-${{ runner.arch }}-

      - run: make tools
      - run: make static

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'tools/checksums.txt', 'scripts/lib/tools.sh') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/**/.terraform.lock.hcl', 'terraform/**/versions.tf') }}
          restore-keys: terraform-plugins-${{ runner.os }}-${{ runner.arch }}-

      - run: make tools
      - run: make test

  # The local lab end to end on the runner's Docker: terraform apply of terraform/envs/local (kind +
  # emulated registry, PostgreSQL, S3, git server, load balancer), the full platform
  # (platform/local/install.sh), every probe of platform/local/check.sh, then destroy + leftover check.
  # Nothing reaches AWS: this job has no credentials.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'tools/checksums.txt', 'scripts/lib/tools.sh') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/**/.terraform.lock.hcl', 'terraform/**/versions.tf') }}
          restore-keys: terraform-plugins-${{ runner.os }}-${{ runner.arch }}-

      - run: make tools
      - run: make e2e
        env:
          LOCAL_DIAGNOSTICS_DIR: ${{ runner.temp }}/local-lab-diagnostics

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-lab-diagnostics
          path: ${{ runner.temp }}/local-lab-diagnostics
          retention-days: 7
          if-no-files-found: ignore
