# Read-only plan of terraform/envs/lab with the tx01v2-gha-plan role (OIDC sub: pull_request or
# refs/heads/main; no environment). Runs only when AWS_PLAN_ROLE_ARN is configured and the PR comes
# from this repository: forks never get AWS credentials. Plans use -lock=false (read-only role).
name: terraform-plan

on:
  pull_request:
    paths:
      - "terraform/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: vars.AWS_PLAN_ROLE_ARN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      # A secret, not a variable: the logs of a public repository are public, and a secret is masked.
      TF_VAR_endpoint_public_access_cidrs: ${{ secrets.LAB_ENDPOINT_PUBLIC_ACCESS_CIDRS }}
      TF_VAR_allow_endpoint_from_anywhere: ${{ vars.LAB_ALLOW_ENDPOINT_FROM_ANYWHERE || 'false' }}
      TF_VAR_cluster_admin_principal_arns: ${{ vars.LAB_CLUSTER_ADMIN_PRINCIPAL_ARNS }}
      TF_VAR_app_deployer_principal_arns: ${{ vars.LAB_APP_DEPLOYER_PRINCIPAL_ARNS || '[]' }}
      TF_VAR_node_instance_types: ${{ vars.LAB_NODE_INSTANCE_TYPES || '["t3.medium","t3a.medium"]' }}
      TF_VAR_node_desired_size: ${{ vars.LAB_NODE_DESIRED_SIZE || '2' }}
      TF_VAR_db_profile: ${{ vars.LAB_DB_PROFILE || 'core' }}
      TF_VAR_dr_region: ${{ vars.LAB_DR_REGION || 'us-west-2' }}
      TF_VAR_db_backup_retention_days: ${{ vars.LAB_DB_BACKUP_RETENTION_DAYS || '1' }}
      TF_VAR_db_deletion_protection: ${{ vars.LAB_DB_DELETION_PROTECTION || 'false' }}
      TF_VAR_db_skip_final_snapshot: ${{ vars.LAB_DB_SKIP_FINAL_SNAPSHOT || 'true' }}
      TF_VAR_db_delete_automated_backups: ${{ vars.LAB_DB_DELETE_AUTOMATED_BACKUPS || 'true' }}
      # Optional public DNS: use secrets so real hostnames and hosted-zone IDs stay out of logs.
      TF_VAR_app_domain_name: ${{ secrets.LAB_APP_DOMAIN_NAME }}
      TF_VAR_route53_public_zone_id: ${{ secrets.LAB_ROUTE53_PUBLIC_ZONE_ID }}
    steps:
      - name: Mask the addresses of the operator in the logs
        env:
          CIDRS: ${{ secrets.LAB_ENDPOINT_PUBLIC_ACCESS_CIDRS }}
          APP_DOMAIN_NAME: ${{ secrets.LAB_APP_DOMAIN_NAME }}
          ROUTE53_PUBLIC_ZONE_ID: ${{ secrets.LAB_ROUTE53_PUBLIC_ZONE_ID }}
        run: |
          if [[ -n "$APP_DOMAIN_NAME" ]]; then
            echo "::add-mask::$APP_DOMAIN_NAME"
          fi
          if [[ -n "$ROUTE53_PUBLIC_ZONE_ID" ]]; then
            echo "::add-mask::$ROUTE53_PUBLIC_ZONE_ID"
          fi
          if [[ -n "$CIDRS" ]]; then
            addresses="$(jq -r '.[]' <<<"$CIDRS")"
            while IFS= read -r cidr; do
              echo "::add-mask::$cidr"
              echo "::add-mask::${cidr%%/*}"
            done <<<"$addresses"
          fi

      - name: Check repository variables
        env:
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: |
          missing=()
          for v in AWS_REGION TF_STATE_BUCKET AWS_PLAN_ROLE_ARN TF_VAR_endpoint_public_access_cidrs TF_VAR_cluster_admin_principal_arns; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing repository variables or secrets for: ${missing[*]}. Settings > Secrets and variables > Actions > Variables; names and values in docs/RUNBOOK.md (section 'Variáveis do GitHub')."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: tx01v2-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Install terraform (pinned, SHA256-verified)
        run: |
          bash scripts/install-tools.sh terraform
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"

      - name: terraform init
        run: terraform -chdir=terraform/envs/lab init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform plan (read-only, -lock=false)
        run: terraform -chdir=terraform/envs/lab plan -lock=false -input=false -no-color -out=tfplan

      - name: Plan text to the job summary
        env:
          CIDRS: ${{ secrets.LAB_ENDPOINT_PUBLIC_ACCESS_CIDRS }}
          APP_DOMAIN_NAME: ${{ secrets.LAB_APP_DOMAIN_NAME }}
          ROUTE53_PUBLIC_ZONE_ID: ${{ secrets.LAB_ROUTE53_PUBLIC_ZONE_ID }}
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          plan_text="$(terraform -chdir=terraform/envs/lab show -no-color tfplan)"
          plan_text="${plan_text//"$account_id"/<ACCOUNT_ID>}"
          if [[ -n "$APP_DOMAIN_NAME" ]]; then plan_text="${plan_text//"$APP_DOMAIN_NAME"/<APP_DOMAIN>}"; fi
          if [[ -n "$ROUTE53_PUBLIC_ZONE_ID" ]]; then plan_text="${plan_text//"$ROUTE53_PUBLIC_ZONE_ID"/<HOSTED_ZONE_ID>}"; fi
          # The job summary and the artifact are not covered by the masks of the log.
          while IFS= read -r cidr; do
            plan_text="${plan_text//"$cidr"/<CIDR>}"
            plan_text="${plan_text//"${cidr%%/*}"/<IP>}"
          done < <(jq -r '.[]' <<<"$CIDRS")
          printf '%s\n' "$plan_text" > plan.txt
          {
            echo "## terraform plan: terraform/envs/lab"
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-plan-lab
          path: plan.txt
          retention-days: 7
          if-no-files-found: error
