# Deliberate lab trade-offs only (docs/GUARDRAILS.md, section "Exceções"). Every entry needs a
# `statement` and an `expired_at` at most ~7 months ahead; scripts/harness.sh enforces both and
# trivy stops honoring an entry after its expiry date.
misconfigurations:
  - id: AWS-0040
    paths:
      - terraform/modules/eks/cluster.tf
    statement: "Public EKS API endpoint on purpose: laptops and GitHub-hosted runners (platform/deploy workflows) reach it; access is limited by endpoint_public_access_cidrs (0.0.0.0/0 needs allow_endpoint_from_anywhere = true) and every request still needs IAM authentication plus an access entry."
    expired_at: 2027-04-30
  - id: AWS-0041
    paths:
      - terraform/modules/eks/cluster.tf
    statement: "The public endpoint CIDRs are the operator's own /32 (documentation IP 203.0.113.10/32 in the example tfvars); a public CIDR is the point of a CIDR-restricted public endpoint. Same justification as AWS-0040."
    expired_at: 2027-04-30
  - id: AWS-0132
    paths:
      - terraform/bootstrap/state_bucket.tf
    statement: "State bucket uses SSE-S3 (AES256) instead of a customer managed key: the bootstrap stays independent of the lab key, which is destroyed with every round; the bucket is private, versioned, TLS-only and BucketOwnerEnforced."
    expired_at: 2027-04-30
  - id: KSV-0056
    paths:
      - platform/manifests/rbac-dx01v2-deployer.yaml
    statement: "The contract (docs/CONTRATO.md): the dx01v2 deployer must create its Services, Ingresses and NetworkPolicies; the Role is namespaced to dx01v2 and bound only to the group dx01v2-deployers."
    expired_at: 2027-04-30
