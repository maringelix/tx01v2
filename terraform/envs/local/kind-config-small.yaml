# LOCAL_SIZE=small (docs/LOCAL_LAB.md): scripts/local/kind-cluster.sh appends this file to
# kind-config.yaml. The control plane is the largest consumer of the lab (the API server alone passes
# 1 GiB with the CRDs of the full platform): GOMEMLIMIT makes the Go garbage collector of each component
# work before the memory of the node runs out. Kubernetes 1.36 nodes get kubeadm v1beta4 from kind
# v0.33.0, which has extraEnvs.
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraEnvs:
        - name: GOMEMLIMIT
          value: 768MiB
    controllerManager:
      extraEnvs:
        - name: GOMEMLIMIT
          value: 96MiB
    etcd:
      local:
        extraEnvs:
          - name: GOMEMLIMIT
            value: 128MiB
