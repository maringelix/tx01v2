# kind cluster of the local lab (terraform/envs/local, cluster tx01v2-local): the local twin of the EKS
# cluster. One node with Kubernetes 1.36, the same minor as the EKS lab (cluster_version = "1.36").
# kindnet, the default CNI, enforces NetworkPolicy since kind v0.24.0. The API server listens on
# 127.0.0.1 only (random port). Node images since kind v0.27.0 read /etc/containerd/certs.d, where
# scripts/local/kind-cluster.sh points localhost:<port> at the registry container.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: 127.0.0.1
nodes:
  - role: control-plane
    # Node image v1.36.4 published in the kind v0.33.0 release notes (verified 2026-10-10)
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
